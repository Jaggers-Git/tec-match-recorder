<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TEC Match Recorder: Metroplex Major slate</title>
<!-- Full-screen 1920x1080 Metroplex Major screen for between sets, breaks and venue TVs. Add it in OBS
     or vMix as its own Browser Source at http://localhost:8420/slate. Optional ?title=Starting%20Soon
     replaces the headline. Promo mode shows the countdown and the register QR; event mode shows the set
     being played. The Nintendo notice is printed in full, as the licence terms ask of promotional material. -->
<style>
  @font-face { font-family: 'Tomorrow'; src: url('/fonts/Tomorrow-Bold.ttf') format('truetype'); font-weight: 700; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body { background: #11151A; color: #fff; font-family: 'Tomorrow', Bahnschrift, 'Segoe UI', sans-serif; position: relative; text-transform: uppercase; }
  [hidden] { display: none !important; }
  svg.gem { display: inline-block; width: .42em; height: .42em; vertical-align: middle; transform: translateY(-.05em); margin: 0 .5em; }
  .wm { position: absolute; right: -140px; top: -150px; width: 860px; opacity: .05; }
  .main { position: absolute; left: 0; right: 0; top: 0; bottom: 150px; display: flex; align-items: center; justify-content: center; gap: 120px; }
  .left { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 30px; }
  .mark { width: 420px; }
  h1 { margin: 0; font-size: 84px; font-weight: 700; letter-spacing: .14em; line-height: 1; }
  .sub { color: #F0B40D; font-size: 28px; font-weight: 700; letter-spacing: .15em; }
  .count { display: flex; align-items: baseline; gap: 18px; margin-top: 6px; }
  .count b { font-size: 120px; line-height: .9; color: #F0B40D; letter-spacing: .02em; }
  .count span { font-size: 30px; letter-spacing: .16em; text-align: left; line-height: 1.15; }
  .now { font-size: 30px; letter-spacing: .1em; color: #fff; display: flex; align-items: center; gap: 22px; }
  .now .tag { background: #F0B40D; color: #11151A; padding: 8px 16px; transform: skewX(-8deg); font-size: 22px; letter-spacing: .14em; }
  .now .tag > span { display: inline-block; transform: skewX(8deg); }
  .now .vs { color: #F0B40D; }
  .now .round { color: #b9c0cc; font-size: 22px; }
  .right { display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .qr { width: 340px; height: 340px; background: #fff; padding: 18px; box-shadow: 0 0 0 6px #F0B40D; }
  .qr img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  .qr-cap { font-size: 26px; letter-spacing: .14em; text-align: center; line-height: 1.3; }
  .qr-cap b { color: #F0B40D; }
  .notice { position: absolute; left: 52px; right: 52px; bottom: 104px; text-transform: none; color: #8e97a8; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.45; text-align: center; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #F0B40D; color: #11151A; display: flex; align-items: center; justify-content: space-between; gap: 40px; padding: 0 52px; font-weight: 700; font-size: 25px; letter-spacing: .07em; }
  #ticker { white-space: nowrap; overflow: hidden; transition: opacity .6s ease; }
  .bar .site { white-space: nowrap; }
</style>
<script src="/theme.js"></script>
</head>
<body>
  <svg class="wm" viewBox="-6 -38 190 128" aria-hidden="true"><g fill="#F0B40D"><polygon points="0,9 9,0 22,0 50,28 78,0 89,-13 100,0 128,28 156,0 169,0 178,9 178,69 169,78 156,78 156,31 128,59 100,31 100,78 78,78 78,31 50,59 22,31 22,78 9,78 0,69"/><polygon points="15.5,-15 21.5,-9 15.5,-3 9.5,-9"/><polygon points="89,-32.5 96.5,-25 89,-17.5 81.5,-25"/><polygon points="162.5,-15 168.5,-9 162.5,-3 156.5,-9"/></g></svg>
  <div class="main">
    <div class="left">
      <!-- the cast-gold crown, as on the stream kit's Starting Soon screen -->
      <svg class="mark" viewBox="-6 -39 201 132" aria-hidden="true">
        <defs><linearGradient id="gf" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0" stop-color="#FFD75E"/><stop offset="0.55" stop-color="#F0B40D"/><stop offset="1" stop-color="#D29A08"/></linearGradient></defs>
        <polygon fill="#6E4E04" points="11,17 20,8 33,8 61,36 89,8 100,-5 111,8 139,36 167,8 180,8 189,17 189,77 180,86 167,86 167,39 139,67 111,39 111,86 89,86 89,39 61,67 33,39 33,86 20,86 11,77"/>
        <polygon fill="#D9A50A" points="22,0 50,28 61,36 33,8"/><polygon fill="#D9A50A" points="89,-13 100,0 111,8 100,-5"/><polygon fill="#D9A50A" points="100,0 128,28 139,36 111,8"/><polygon fill="#D9A50A" points="169,0 178,9 189,17 180,8"/>
        <polygon fill="#B07F06" points="178,9 178,69 189,77 189,17"/><polygon fill="#966905" points="178,69 169,78 180,86 189,77"/><polygon fill="#7E5804" points="169,78 156,78 167,86 180,86"/><polygon fill="#966905" points="156,31 128,59 139,67 167,39"/><polygon fill="#B07F06" points="100,31 100,78 111,86 111,39"/><polygon fill="#7E5804" points="100,78 78,78 89,86 111,86"/><polygon fill="#966905" points="78,31 50,59 61,67 89,39"/><polygon fill="#B07F06" points="22,31 22,78 33,86 33,39"/><polygon fill="#7E5804" points="22,78 9,78 20,86 33,86"/>
        <polygon fill="url(#gf)" points="0,9 9,0 22,0 50,28 78,0 89,-13 100,0 128,28 156,0 169,0 178,9 178,69 169,78 156,78 156,31 128,59 100,31 100,78 78,78 78,31 50,59 22,31 22,78 9,78 0,69"/>
        <polygon fill="#6E4E04" points="26.5,-9 32.5,-3 26.5,3 20.5,-3"/><polygon fill="#D9A50A" points="15.5,-17 21.5,-11 32.5,-3 26.5,-9"/><polygon fill="#966905" points="21.5,-11 15.5,-5 26.5,3 32.5,-3"/><polygon fill="url(#gf)" points="15.5,-17 21.5,-11 15.5,-5 9.5,-11"/>
        <polygon fill="#6E4E04" points="100,-24.5 107.5,-17 100,-9.5 92.5,-17"/><polygon fill="#D9A50A" points="89,-32.5 96.5,-25 107.5,-17 100,-24.5"/><polygon fill="#966905" points="96.5,-25 89,-17.5 100,-9.5 107.5,-17"/><polygon fill="url(#gf)" points="89,-32.5 96.5,-25 89,-17.5 81.5,-25"/>
        <polygon fill="#6E4E04" points="173.5,-9 179.5,-3 173.5,3 167.5,-3"/><polygon fill="#D9A50A" points="162.5,-17 168.5,-11 179.5,-3 173.5,-9"/><polygon fill="#966905" points="168.5,-11 162.5,-5 173.5,3 179.5,-3"/><polygon fill="url(#gf)" points="162.5,-17 168.5,-11 162.5,-5 156.5,-11"/>
      </svg>
      <h1 id="title">Metroplex Major</h1>
      <div id="sub" class="sub"></div>
      <div id="count" class="count" hidden><b id="days"></b><span id="days-label"></span></div>
      <div id="now" class="now" hidden><span class="tag"><span id="now-tag">On now</span></span><span id="now-p1"></span><span class="vs">vs</span><span id="now-p2"></span><span id="now-round" class="round"></span></div>
    </div>
    <div id="qr" class="right" hidden>
      <div class="qr"><img src="/mm-register.svg" alt=""></div>
      <div class="qr-cap">Register now<br><b id="register"></b></div>
    </div>
  </div>
  <div id="notice" class="notice"></div>
  <div class="bar"><span id="ticker"></span><span id="site" class="site"></span></div>
<script src="/mm.js"></script>
<script>
(() => {
  'use strict';
  const $ = (sel) => document.querySelector(sel);
  const params = new URLSearchParams(location.search);
  let S = null;
  let ticker = null;
  function render() {
    if (!S) return;
    const mm = (S.branding && S.branding.mm) || {};
    const promo = mm.mode !== 'event';
    const c = S.current || {};
    const live = !!(c.p1 && c.p2);
    $('#title').textContent = params.get('title') || 'Metroplex Major';
    $('#sub').innerHTML = window.MM.gems(params.get('title') ? 'Metroplex Major ◆ Feb 5-7, 2027 ◆ UNT Dallas' : 'Feb 5-7, 2027 ◆ UNT Dallas');
    // Countdown and QR only before the weekend.
    const days = window.MM.daysTo(mm.start);
    $('#count').hidden = !promo || days < 1;
    $('#days').textContent = String(days);
    $('#days-label').innerHTML = `${days === 1 ? 'Day' : 'Days'}<br>to go`;
    $('#qr').hidden = !promo;
    $('#register').textContent = mm.register || '';
    // The set on the station: "On now" while recording, "Up next" once picked.
    $('#now').hidden = !live;
    if (live) {
      $('#now-tag').textContent = S.rec && S.rec.active ? 'On now' : 'Up next';
      $('#now-p1').textContent = c.p1;
      $('#now-p2').textContent = c.p2;
      $('#now-round').textContent = c.round || '';
    }
    $('#site').innerHTML = window.MM.gems(`${mm.site || 'metroplexmajor.com'} ◆ #MetroplexMajor`);
    $('#notice').innerHTML = window.MM.gems(`${promo ? 'Metroplex Major: ' : ''}Nintendo is not a sponsor of or affiliated with this tournament. Terms for participating in and viewing Licensed Tournaments using Nintendo Games: https://en-americas-support.nintendo.com/app/answers/detail/a_id/63454`) + `<br>${window.MM.gems(`Tournament license ${mm.license || ''}`)}`;
    // The bar already carries the site; the ticker skips lines that only repeat it.
    if (!ticker) ticker = window.MM.ticker($('#ticker'), () => window.MM.lines(S).filter((l) => !/^metroplexmajor\.com/i.test(l)));
  }
  let loadedVersion = '';
  const es = new EventSource('/api/events');
  es.addEventListener('state', (ev) => {
    S = JSON.parse(ev.data);
    if (S.version && loadedVersion && S.version !== loadedVersion) { location.reload(); return; }
    loadedVersion = loadedVersion || S.version || '';
    render();
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
})();
</script>
</body>
</html>
