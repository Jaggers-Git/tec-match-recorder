<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TEC Match Recorder: Texas Esports Collegiate screens</title>
<!-- Full-screen 1920x1080 Texas Esports Collegiate screens, served at /slate while the station is in the
     Texas Esports Collegiate theme: ?scene=starting (Starting Soon), ?scene=brb (Be Right Back) and
     ?scene=end (Thanks for Watching); ?title= replaces the headline. The look follows the Fall Split
     graphics: near-black, Collegiate Blue, Tomorrow. With the Metroplex Major promo on (Settings, Look and
     games), Starting Soon carries a Major strip along the bottom and BRB and the end screen a Major card on
     the right, each in the Major's own gold-on-midnight look and with the Nintendo notice and license
     number its license asks for on promotional material. -->
<style>
  @font-face { font-family: 'Tomorrow'; src: url('/fonts/Tomorrow-Regular.ttf') format('truetype'); font-weight: 400; }
  @font-face { font-family: 'Tomorrow'; src: url('/fonts/Tomorrow-SemiBold.ttf') format('truetype'); font-weight: 600; }
  @font-face { font-family: 'Tomorrow'; src: url('/fonts/Tomorrow-Bold.ttf') format('truetype'); font-weight: 700; }
  @font-face { font-family: 'Tomorrow'; src: url('/fonts/Tomorrow-ExtraBold.ttf') format('truetype'); font-weight: 800; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  /* OBS gives every Browser Source "body { background-color: rgba(0,0,0,0) }", so the black lives on html too. */
  html { background: #0A0A0A; }
  body { background: #0A0A0A; color: #fff; font-family: 'Tomorrow', Bahnschrift, 'Segoe UI', sans-serif; position: relative; -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  :root { --c-fill: #2B6FD4; --c-text: #5B95EA; --c-gleam: #a8c8f6; --c-tile: #2B6FD4; --c-tile-ink: #fff;
    --c-glow: radial-gradient(60% 70% at 100% 0%, rgba(43,111,212,.30) 0%, rgba(43,111,212,0) 70%); }
  /* Texas Esports Conference: the Unity gradient carries every rule and fill, white and light grey the type. */
  :root[data-theme="conf"] { --c-fill: linear-gradient(90deg, #ff4635, #fa6529, #f0b40d, #ecd402, #ccdc01, #7df000, #45ff00, #007bff); --c-text: #c8ccd4; --c-gleam: #ffd2a8;
    --c-tile: #f3f4f6; --c-tile-ink: #0a0a0a;
    --c-glow: radial-gradient(55% 65% at 100% 0%, rgba(255,70,53,.20) 0%, rgba(255,70,53,0) 70%), radial-gradient(50% 60% at 0% 100%, rgba(0,123,255,.18) 0%, rgba(0,123,255,0) 70%); }
  :root[data-theme="conf"] .tile::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 8px; background: linear-gradient(180deg, #ff4635, #f0b40d, #7df000, #007bff); }
  .glow { position: absolute; inset: 0; background: var(--c-glow); transform-origin: 100% 0; --breathe-lo: .6; --breathe-s0: 1; --breathe-s1: 1.12; animation: breathe 9s ease-in-out infinite; }
  .topbar { position: absolute; left: 0; right: 0; top: 0; height: 10px; background: var(--c-fill); --sheen-w: 14%; --sheen-a: .8; --sheen-every: 6s; }
  .wm { position: absolute; right: -170px; bottom: -190px; width: 900px; opacity: .06; animation: drift 28s ease-in-out infinite alternate; }
  /* motion (motion.css): the headline catches a light now and then */
  h1.gleam { background: linear-gradient(100deg, #fff 0%, #fff 42%, var(--c-gleam) 50%, #fff 58%, #fff 100%) no-repeat; background-size: 300% 100%; background-position: 100% 0; -webkit-background-clip: text; background-clip: text; color: transparent; animation: gleam 8s ease-in-out 3s infinite; }
  @keyframes gleam { 0% { background-position: 100% 0; } 30%, 100% { background-position: 0% 0; } }
  html.still h1.gleam { color: #fff; background: none; }
  .wm svg { width: 100%; height: auto; display: block; }

  .main { position: absolute; left: 110px; top: 96px; bottom: 96px; width: 1700px; display: flex; flex-direction: column; }
  body.promo-card .main { width: 1040px; }
  .lockup { display: flex; align-items: center; gap: 36px; }
  .lockup svg { height: 92px; width: auto; display: block; }
  /* The host school's or venue's logo (Settings, Look and games), beside the lockup at its height after a thin rule. */
  .host { display: flex; align-items: center; gap: 36px; }
  .host::before { content: ''; flex: none; width: 2px; height: 92px; background: rgba(255,255,255,.28); }
  .host img { display: block; height: 92px; width: auto; max-width: 440px; object-fit: contain; }
  .stack { margin-top: auto; margin-bottom: auto; display: flex; flex-direction: column; align-items: flex-start; }
  .kicker { font-weight: 600; font-size: 30px; letter-spacing: .26em; text-transform: uppercase; color: var(--c-text); line-height: 1.4; }
  body.promo-card .kicker { font-size: 23px; letter-spacing: .2em; }
  .kicker .sep { display: inline-block; width: 10px; height: 10px; background: var(--c-fill); transform: rotate(45deg) translateY(-4px); margin: 0 .7em 0 .55em; }
  h1 { margin: 18px 0 0; font-weight: 800; font-size: 148px; line-height: .92; letter-spacing: .01em; text-transform: uppercase; }
  body.promo-card h1 { font-size: 128px; }
  .message { margin-top: 40px; font-weight: 600; font-size: 36px; line-height: 1.25; max-width: 100%; padding: 18px 28px; border: 2px solid rgba(255,255,255,.16); background: rgba(16,22,34,.82); border-radius: 6px; box-sizing: border-box; }

  /* Up next / on now: the date-card shape from the Fall Split graphics, blue tile on the left. */
  .card { margin-top: 44px; display: flex; border: 2px solid rgba(255,255,255,.16); background: rgba(16,22,34,.82); border-radius: 6px; overflow: hidden; max-width: 100%; }
  .tile { position: relative; --sheen-every: 7s; --sheen-delay: 1.5s; --sheen-a: .45; flex: none; width: 190px; background: var(--c-tile); color: var(--c-tile-ink); display: flex; align-items: center; justify-content: center; text-transform: uppercase; font-weight: 700; font-size: 26px; letter-spacing: .2em; padding-left: .2em; text-align: center; line-height: 1.15; }
  .card .body { padding: 22px 34px 24px; min-width: 0; }
  .vsline { display: flex; align-items: baseline; gap: .45em; font-weight: 800; font-size: 46px; line-height: 1.05; white-space: nowrap; overflow: hidden; }
  .vsline > span { flex: none; }
  .vsline .vs { color: var(--c-text); font-size: .62em; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  .round { margin-top: 10px; font-weight: 600; font-size: 24px; letter-spacing: .2em; text-transform: uppercase; color: var(--c-text); }
  /* Team games: the series score beside the names, and the maps played so far under the card. */
  .vsline .sc { color: var(--c-text); font-size: .8em; }
  /* Team logos (Settings, Team logos) beside the names, on light tiles. */
  .vsline img.tl { flex: none; align-self: center; height: 1.2em; width: 1.2em; object-fit: contain; background: #f3f4f6; border-radius: 4px; padding: .1em; box-sizing: border-box; }
  .maps { margin-top: 18px; display: grid; gap: 8px; min-width: 760px; max-width: 100%; }
  .maps .m { display: grid; grid-template-columns: 90px 1fr 190px auto; gap: 18px; align-items: baseline; padding: 8px 4px; border-bottom: 1px solid rgba(255,255,255,.12); font-size: 26px; }
  .maps .no { font-weight: 600; font-size: 18px; letter-spacing: .2em; text-transform: uppercase; color: var(--c-text); }
  .maps .nm { font-weight: 700; }
  .maps .md { font-weight: 600; font-size: 18px; letter-spacing: .18em; text-transform: uppercase; color: #9aa0a6; }
  .maps .wn { font-weight: 800; text-transform: uppercase; text-align: right; }
  .maps .m.next .nm, .maps .m.next .wn { color: #9aa0a6; }

  /* A crawl along the bottom edge, so the screen always has something moving: the event, the set on the
     station, the typed message, the site and, with the promo on, the Major's lines (motion.css, MM.bar). */
  .tk { position: absolute; left: 0; right: 0; bottom: 0; height: 50px; display: flex; align-items: center; background: rgba(13,17,24,.94);
    color: #fff; font-weight: 700; font-size: 21px; letter-spacing: .1em; text-transform: uppercase; }
  .tk::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--c-fill); }
  #ticker { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; transition: opacity .6s ease; }
  .tk svg.gem { color: var(--c-gem, #2B6FD4); }
  :root[data-theme="conf"] .tk { background: rgba(13,15,18,.94); --c-gem: #f3f4f6; }
  .site { position: absolute; left: 110px; bottom: 74px; font-weight: 800; font-size: 30px; letter-spacing: .04em; }

  /* ---------- Metroplex Major: its own brand (Major Gold on Midnight), boxed off from the Collegiate look ---------- */
  svg.gem { display: inline-block; width: .42em; height: .42em; vertical-align: middle; transform: translateY(-.05em); margin: 0 .5em; color: #F0B40D; }
  .notice { text-transform: none; color: #8e97a8; font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 400; font-size: 15px; line-height: 1.45; letter-spacing: 0; }

  /* BRB and end screen: the Major card on the right. */
  .mm-card { position: absolute; right: 110px; top: 96px; bottom: 96px; width: 600px; display: flex; flex-direction: column; }
  .mm-box { position: relative; flex: 1; background: #11151A; border: 2px solid #F0B40D; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 34px 40px; box-sizing: border-box; gap: 18px; box-shadow: 0 0 60px rgba(240,180,13,.10); }
  /* a warmer gold glow that swells and settles around the Major card */
  .mm-box::before { content: ''; position: absolute; inset: -2px; border-radius: 6px; box-shadow: 0 0 70px rgba(240,180,13,.32), inset 0 0 40px rgba(240,180,13,.08); opacity: 0; animation: glow-pulse 7s ease-in-out infinite; pointer-events: none; }
  .mm-kicker { font-weight: 600; font-size: 20px; letter-spacing: .26em; text-transform: uppercase; color: #F0B40D; }
  .mm-crown { width: 230px; height: auto; }
  .mm-name { font-weight: 700; font-size: 52px; letter-spacing: .12em; line-height: 1; text-transform: uppercase; }
  .mm-when { font-weight: 700; font-size: 24px; letter-spacing: .14em; text-transform: uppercase; color: #F0B40D; }
  .mm-what { font-weight: 400; font-size: 22px; line-height: 1.35; color: #d7dbe2; max-width: 460px; }
  .mm-count { display: flex; align-items: baseline; gap: 14px; text-transform: uppercase; }
  .mm-count b { font-weight: 800; font-size: 84px; line-height: .9; color: #F0B40D; }
  .mm-count span { font-weight: 700; font-size: 24px; letter-spacing: .16em; text-align: left; line-height: 1.15; }
  .mm-reg { display: flex; align-items: center; gap: 22px; margin-top: 6px; }
  .mm-qr { width: 168px; height: 168px; background: #fff; padding: 10px; box-sizing: border-box; flex: none; }
  .mm-qr img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  .mm-reg-cap { text-align: left; font-weight: 700; font-size: 22px; letter-spacing: .14em; text-transform: uppercase; line-height: 1.35; }
  .mm-reg-cap b { display: block; color: #F0B40D; font-size: 26px; letter-spacing: .06em; text-transform: none; }
  .mm-card .notice { margin-top: 14px; }

  /* Starting Soon: a slim Major strip along the bottom, with the notice under it. */
  .mm-strip { position: absolute; right: 110px; bottom: 70px; width: 1040px; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .mm-strip .row { position: relative; --sheen-every: 9s; --sheen-delay: 4s; --sheen-a: .22; --sheen-w: 18%; display: flex; align-items: center; gap: 18px; background: #11151A; border: 2px solid #F0B40D; border-radius: 6px; padding: 12px 22px; text-transform: uppercase; font-weight: 700; font-size: 22px; letter-spacing: .1em; white-space: nowrap; }
  .mm-strip .row svg.crown { height: 34px; width: auto; flex: none; }
  .mm-strip .row .gold { color: #F0B40D; }
  .mm-strip .notice { text-align: right; max-width: 1040px; }
</style>
<link rel="stylesheet" href="/motion.css">
<script src="/theme.js"></script>

    <div id="lockup" class="lockup"><div id="lockup-art"></div><div id="host" class="host" hidden><img id="host-img" alt=""></div></div>

<script>
(() => {
  'use strict';
  const $ = (sel) => document.querySelector(sel);
  const params = new URLSearchParams(location.search);
  const scene = params.get('scene') || '';
  const SCENE_TITLES = { starting: 'Starting Soon', brb: 'Be Right Back', end: 'Thanks for Watching' };
  // Collegiate and Conference share this page; the theme the page loaded in decides the art.
  const loadedTheme = document.documentElement.dataset.theme === 'conf' ? 'conf' : 'col';
  const ART = loadedTheme === 'conf' ? window.CONF : window.COL;
  $('#lockup-art').innerHTML = ART.lockup();
  $('#wm').innerHTML = loadedTheme === 'conf' ? window.CONF.mark() : window.COL.mark('#2B6FD4');
  window.MM.shine($('#lockup-art svg'), 'path, polygon', { delay: 0.5, every: 8 });
  window.MM.shine($('#mm-crown'), 'polygon[fill="url(#gf)"]', { delay: 3, every: 7 });
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let S = null;
  let ticker = null;
  // The crawl's lines: the event, the set on the station, the typed message, the site, then the Major's
  // own lines while its promo is on (they carry its Nintendo notice and license).
  function tickerLines() {
    if (!S) return [];
    const b = S.branding || {};
    const cfg = (loadedTheme === 'conf' ? b.conf : b.col) || {};
    const org = loadedTheme === 'conf' ? 'Texas Esports Conference' : 'Texas Esports Collegiate';
    const title = cfg.title || (loadedTheme === 'conf' ? 'Fall Finals' : 'Fall Split');
    const c = S.current || {};
    const lines = [`${org} ◆ ${title}`];
    if (cfg.game) lines.push(cfg.game);
    if (c.p1 && c.p2 && scene !== 'end') lines.push(`${S.rec && S.rec.active ? 'On now' : 'Up next'} ◆ ${c.p1} vs ${c.p2}${c.round ? ` ◆ ${c.round}` : ''}`);
    const msg = (S.screens && S.screens.message) || '';
    if (msg) lines.push(msg);
    lines.push('texasesports.org');
    if (cfg.promo !== false) lines.push(...window.MM.lines(S));
    return lines;
  }
  function render() {
    if (!S) return;
    const b = S.branding || {};
    // The station left the Collegiate theme: /slate now serves that theme's screen, so load it.
    // Another theme (or Collegiate swapped for Conference): /slate serves that look, so load it.
    if (b.theme && b.theme !== loadedTheme) { location.reload(); return; }
    // Settings, Stream screens: Motion off keeps the screen still.
    document.documentElement.classList.toggle('still', b.motion === false);
    // Settings, Stream screens: the station's own event photo behind Be Right Back.
    const photo = scene === 'brb' ? b.photo || '' : '';
    const ph = $('#photo');
    ph.hidden = !photo;
    if (photo && ph.dataset.src !== photo) { ph.dataset.src = photo; ph.style.backgroundImage = `url("${photo}")`; }
    // Settings, Look and games: the host's logo beside the lockup.
    const host = (b.logos || {})[loadedTheme] || '';
    $('#host').hidden = !host;
    if (host && $('#host-img').getAttribute('src') !== host) $('#host-img').src = host;
    if (!ticker) ticker = window.MM.bar($('#ticker'), tickerLines);
    ticker.set(b.motion !== false);
    const col = (loadedTheme === 'conf' ? b.conf : b.col) || {};
    const mm = b.mm || {};
    const promo = col.promo !== false;
    const c = S.current || {};
    const live = !!(c.p1 && c.p2) && scene !== 'end';
    // Headline: the scene's, else ?title=, else the event title alone.
    const headline = params.get('title') || SCENE_TITLES[scene] || '';
    const eventTitle = col.title || (loadedTheme === 'conf' ? 'Fall Finals' : 'Fall Split');
    $('#title').textContent = headline || eventTitle;
    const kicker = headline ? [eventTitle, col.game].filter(Boolean) : [col.game].filter(Boolean);
    $('#kicker').innerHTML = kicker.map(esc).join('<span class="sep"></span>');
    // The line typed in the dashboard (Stream screens).
    const msg = (S.screens && S.screens.message) || '';
    $('#message').hidden = !msg;
    $('#message').textContent = msg;
    // The set on the station: "On now" while recording, "Up next" once picked.
    $('#now').hidden = !live;
    if (live) {
      $('#now-tag').textContent = S.rec && S.rec.active ? 'On now' : 'Up next';
      $('#now-dot').hidden = !(S.rec && S.rec.active);
      $('#now-p1').textContent = c.p1;
      $('#now-p2').textContent = c.p2;
      for (const side of [1, 2]) {
        const url = (S.teamLogos || {})[`p${side}`] || '';
        const im = $(`#now-l${side}`);
        im.hidden = !url;
        if (url && im.getAttribute('src') !== url) im.src = url;
      }
      const crews = b.crews && b.crews.enabled;
      $('#now-round').textContent = [c.round, crews ? 'Crew battle' : ''].filter(Boolean).join('  /  ');
    }
    // Team games (Overwatch, Marvel Rivals): the maps so far and the next one, on BRB and the end screen.
    const sr = S.series;
    const played = sr ? sr.maps.filter((m) => m.winner || m.map || m.mode) : [];
    const showMaps = !!(sr && played.length && (scene === 'brb' || scene === 'end'));
    $('#maps').hidden = !showMaps;
    if (showMaps) {
      const names = [c.p1 || 'Team 1', c.p2 || 'Team 2'];
      $('#maps').innerHTML = played.slice(0, 7).map((m, i) => `<div class="m${m.winner ? '' : ' next'}"><span class="no">Map ${i + 1}</span><span class="nm">${esc(m.map || 'To be picked')}</span><span class="md">${esc(m.mode || '')}</span><span class="wn">${m.winner === 'draw' ? 'Draw' : m.winner ? esc(names[m.winner - 1]) : 'Next'}</span></div>`).join('');
    }
    // Metroplex Major: a card on BRB and the end screen, a strip on Starting Soon (and on a bare /slate).
    const card = promo && (scene === 'brb' || scene === 'end');
    const strip = promo && !card;
    document.body.classList.toggle('promo-card', card);
    $('#mm-card').hidden = !card;
    $('#mm-strip').hidden = !strip;
    $('#wm').hidden = card;
    // Long crew names shrink until both fit beside "vs" (the card is narrower next to the Major card).
    if (live) {
      const line = document.querySelector('.vsline');
      const room = ($('.main').clientWidth || 1040) - 190 - 72;
      let size = 46;
      line.style.fontSize = `${size}px`;
      while (size > 24 && line.scrollWidth > room) { size -= 2; line.style.fontSize = `${size}px`; }
    }
    const days = window.MM.daysTo(mm.start);
    const notice = window.MM.gems(`Metroplex Major: Nintendo is not a sponsor of or affiliated with this tournament. Terms for participating in and viewing Licensed Tournaments using Nintendo Games: https://en-americas-support.nintendo.com/app/answers/detail/a_id/63454. Tournament license ${mm.license || ''}`);
    if (card) {
      $('#mm-when').innerHTML = window.MM.gems('Feb 5-7, 2027 ◆ UNT Dallas');
      $('#mm-count').hidden = days < 1;
      $('#mm-days').textContent = String(days);
      $('#mm-days-label').innerHTML = `${days === 1 ? 'Day' : 'Days'}<br>to go`;
      $('#mm-register').textContent = mm.register || 'start.gg/metroplex';
      $('#mm-card-notice').innerHTML = notice;
    }
    if (strip) {
      $('#mm-strip-text').innerHTML = `Metroplex Major${window.MM.GEM}<span class="gold">Feb 5-7, 2027</span>${window.MM.GEM}UNT Dallas${window.MM.GEM}Register at <span class="gold">${esc(mm.register || 'start.gg/metroplex')}</span>`;
      $('#mm-strip-notice').innerHTML = notice;
    }
  }
  let loadedVersion = '';
  const es = new EventSource('/api/events');
  es.addEventListener('state', (ev) => {
    S = JSON.parse(ev.data);
    if (S.version && loadedVersion && S.version !== loadedVersion) { location.reload(); return; }
    loadedVersion = loadedVersion || S.version || '';
    render();
  });
  // Re-fit the crew names once Tomorrow has loaded (it loads only when first used, after fonts.ready).
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
  if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', render);
})();
</script>
</body>
</html>
