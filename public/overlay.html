<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TEC Match Recorder: stream overlay</title>
<style>
  @font-face { font-family: 'Tomorrow'; src: url('/fonts/Tomorrow-Bold.ttf') format('truetype'); font-weight: 700; }
  @font-face { font-family: 'Silkscreen'; src: url('/fonts/Silkscreen-Bold.ttf') format('truetype'); font-weight: 700; }
  html, body { margin: 0; padding: 0; background: transparent; width: 1920px; height: 1080px; overflow: hidden; }
  body { position: relative; font-family: 'Tomorrow', Bahnschrift, 'Segoe UI', sans-serif; }
  [hidden] { display: none !important; }
  /* Pieces: white edge underneath, dark face on top. Faces of touching pieces overlap so joints are seamless. */
  .piece { position: absolute; }
  .piece .edge { position: absolute; inset: 0; background: #fff; filter: drop-shadow(0 2px 3px rgba(0,0,0,.4)); }
  .piece .face { position: absolute; inset: 3px; background: #2a2626; }
  .piece.bridge .face { background: #3b3636; }
  .seg { position: absolute; }
  .seg.center { background: #3b3636; }
  .seg.badge { background: #fff; color: #1b1818; display: flex; align-items: center; justify-content: center; font-weight: 700; line-height: 1; }
  .text {
    position: absolute; display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap;
    text-shadow: 0 2px 4px rgba(0,0,0,.6); line-height: 1;
  }
  .text span { display: inline-block; }
  /* Game-win pips under each name plate (Bo3 shows two, Bo5 three). Lit = TEC Ignite Red. */
  .pips { position: absolute; display: none; gap: 8px; }
  .pips .pip { width: 34px; height: 13px; background: #2a2626; border: 2px solid #fff; transform: skewX(-18deg); filter: drop-shadow(0 2px 3px rgba(0,0,0,.4)); }
  .pips .pip.on { background: #FF3D2E; }

  /* Tuesday Takedown colours on the notched (Tekken / SF6) shape, for TT stations that record other games. */
  .tt-colors .piece .edge, .tt-colors .piece.bridge .face, .tt-colors .seg.center { background: #0a0a0a; }
  .tt-colors .piece .face { background: #6D2E3F; }
  .tt-colors .text { font-family: 'Silkscreen', 'Tomorrow', monospace; text-transform: none; font-variant-caps: small-caps; letter-spacing: 0; }
  .tt-colors .pips .pip { background: #0a0a0a; border-color: #F2B53A; }
  .tt-colors .pips .pip.on { background: #FCE319; }

  /* Tuesday Takedown scoreboard: maroon name plates in a black frame, belt logo over the middle,
     round and set format in black bands underneath, the series name in yellow on the left. */
  #tt-board { position: absolute; inset: 0; filter: drop-shadow(0 3px 5px rgba(0,0,0,.5)); }
  #tt .blk { position: absolute; background: #0a0a0a; }
  #tt .plate { position: absolute; background: linear-gradient(180deg, #7c3749 0%, #6D2E3F 42%, #5f2636 100%); }
  #tt .tt-text {
    position: absolute; display: flex; align-items: center; justify-content: center;
    color: #fff; font-family: 'Silkscreen', 'Tomorrow', monospace; font-weight: 700; font-variant-caps: small-caps;
    white-space: nowrap; line-height: 1; text-shadow: 0 3px 0 rgba(0,0,0,.55);
  }
  #tt .tt-text span { display: inline-block; }
  #tt .tt-sub { color: #ece4e6; text-shadow: none; }
  #tt .tt-label { justify-content: flex-end; color: #FCE319; text-shadow: -2px 0 #000, 2px 0 #000, 0 -2px #000, 0 2px #000, -2px -2px #000, 2px 2px #000, -2px 2px #000, 2px -2px #000, 0 5px 0 #000; }
  #tt .tt-pips { position: absolute; display: none; gap: 7px; }
  #tt .tt-pips .pip { width: 26px; height: 12px; background: #0a0a0a; border: 2px solid #F2B53A; transform: skewX(-20deg); box-shadow: 0 2px 3px rgba(0,0,0,.5); }
  #tt .tt-pips .pip.on { background: #FCE319; box-shadow: 0 0 8px rgba(252, 227, 25, .65); }
  #tt .tt-logo { position: absolute; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0,0,0,.55)); }
  #tt .tt-logo svg { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="tec">
<!-- edges first, faces after, so the dark faces cover the white seams where pieces meet -->
<div id="edges"></div>
<div id="faces"></div>
<div id="segC" class="seg center"></div>
<div id="s1" class="seg badge"><span></span></div>
<div id="s2" class="seg badge"><span></span></div>
<div id="p1" class="text"><span></span></div>
<div id="p2" class="text"><span></span></div>
<div id="center" class="text"><span></span></div>
<div id="w1" class="pips"></div>
<div id="w2" class="pips"></div>
</div>
<div id="tt" hidden>
  <div id="tt-board">
    <div id="tt-frame1" class="blk"></div>
    <div id="tt-frame2" class="blk"></div>
    <div id="tt-band1" class="blk"></div>
    <div id="tt-band2" class="blk"></div>
    <div id="tt-plate1" class="plate"></div>
    <div id="tt-plate2" class="plate"></div>
  </div>
  <div id="tt-label" class="tt-text tt-label"><span></span></div>
  <div id="tt-n1" class="tt-text"><span></span></div>
  <div id="tt-n2" class="tt-text"><span></span></div>
  <div id="tt-s1" class="tt-text"><span></span></div>
  <div id="tt-s2" class="tt-text"><span></span></div>
  <div id="tt-sub1" class="tt-text tt-sub"><span></span></div>
  <div id="tt-sub2" class="tt-text tt-sub"><span></span></div>
  <div id="tt-w1" class="tt-pips"></div>
  <div id="tt-w2" class="tt-pips"></div>
  <img id="tt-logo" class="tt-logo" alt="" hidden>
  <div id="tt-emblem" class="tt-logo" hidden><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="#1a0d10" stroke="#F2B53A" stroke-width="6"/><circle cx="50" cy="50" r="36" fill="#6D2E3F"/><text x="50" y="62" text-anchor="middle" font-family="Silkscreen, monospace" font-weight="700" font-size="30" fill="#FCE319">TT</text></svg></div>
</div>
<script src="/overlay.js"></script>
</body>
</html>
