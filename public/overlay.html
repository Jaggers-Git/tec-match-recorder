<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TEC Match Recorder: stream overlay</title>
<style>
  @font-face { font-family: 'Tomorrow'; src: url('/fonts/Tomorrow-Bold.ttf') format('truetype'); font-weight: 700; }
  @font-face { font-family: 'Silkscreen'; src: url('/fonts/Silkscreen-Bold.ttf') format('truetype'); font-weight: 700; }
  @font-face { font-family: 'Urban Constructed'; src: url('/fonts/UrbanConstructed-Regular.ttf') format('truetype'); font-weight: 100 900; }
  html, body { margin: 0; padding: 0; background: transparent; width: 1920px; height: 1080px; overflow: hidden; }
  body { position: relative; font-family: 'Urban Constructed', 'Tomorrow', Bahnschrift, 'Segoe UI', sans-serif; }
  [hidden] { display: none !important; }
  /* Pieces: white edge underneath, dark face on top. Faces of touching pieces overlap so joints are seamless. */
  .piece { position: absolute; }
  .piece .edge { position: absolute; inset: 0; background: #fff; filter: drop-shadow(0 2px 3px rgba(0,0,0,.4)); }
  .piece .face { position: absolute; inset: 3px; background: #2a2626; }
  .piece.bridge .face { background: #3b3636; }
  .seg { position: absolute; }
  .seg.center { background: #3b3636; }
  .seg.badge { background: #fff; color: #1b1818; display: flex; align-items: center; justify-content: center; font-weight: 700; line-height: 1; }
  .text {
    position: absolute; display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap;
    text-shadow: 0 2px 4px rgba(0,0,0,.6); line-height: 1;
  }
  .text span { display: inline-block; }
  /* Game-win pips under each name plate (Bo3 shows two, Bo5 three). Lit = TEC Ignite Red. */
  .pips { position: absolute; display: none; gap: 8px; }
  .pips .pip { width: 34px; height: 13px; background: #2a2626; border: 2px solid #fff; transform: skewX(-18deg); filter: drop-shadow(0 2px 3px rgba(0,0,0,.4)); }
  .pips .pip.on { background: #FF3D2E; }

  /* Tuesday Takedown colours on the notched (Tekken / SF6) shape, for TT stations that record other games. */
  .tt-colors .piece .edge, .tt-colors .piece.bridge .face, .tt-colors .seg.center { background: #0a0a0a; }
  .tt-colors .piece .face { background: #6D2E3F; }
  /* Urban Constructed's lowercase is drawn as small capitals, so mixed case keeps the TT small-caps look. */
  .tt-colors .text { font-family: 'Urban Constructed', 'Silkscreen', monospace; text-transform: none; letter-spacing: 0; }
  .tt-colors .pips .pip { background: #0a0a0a; border-color: #F2B53A; }
  .tt-colors .pips .pip.on { background: #FCE319; }

  /* Tuesday Takedown scoreboard: maroon name plates in a black frame, belt logo over the middle,
     round and set format in black bands underneath, the series name in yellow on the left. */
  #tt-board { position: absolute; inset: 0; filter: drop-shadow(0 3px 5px rgba(0,0,0,.5)); }
  #tt .blk { position: absolute; background: #0a0a0a; }
  #tt .plate { position: absolute; background: linear-gradient(180deg, #7c3749 0%, #6D2E3F 42%, #5f2636 100%); }
  #tt .tt-text {
    position: absolute; display: flex; align-items: center; justify-content: center;
    color: #fff; font-family: 'Urban Constructed', 'Silkscreen', monospace; font-weight: 700;
    white-space: nowrap; line-height: 1; text-shadow: 0 3px 0 rgba(0,0,0,.55);
  }
  #tt .tt-text span { display: inline-block; }
  #tt .tt-sub { color: #ece4e6; text-shadow: none; }
  #tt .tt-label { justify-content: flex-end; color: #FCE319; text-shadow: -2px 0 #000, 2px 0 #000, 0 -2px #000, 0 2px #000, -2px -2px #000, 2px 2px #000, -2px 2px #000, 2px -2px #000, 0 5px 0 #000; }
  #tt .tt-pips { position: absolute; display: none; gap: 7px; }
  #tt .tt-pips .pip { width: 26px; height: 12px; background: #0a0a0a; border: 2px solid #F2B53A; transform: skewX(-20deg); box-shadow: 0 2px 3px rgba(0,0,0,.5); }
  #tt .tt-pips .pip.on { background: #FCE319; box-shadow: 0 0 8px rgba(252, 227, 25, .65); }
  #tt .tt-logo { position: absolute; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0,0,0,.55)); }
  #tt .tt-logo svg { width: 100%; height: 100%; }

  /* Metroplex Major: the MM stream kit's scoreboard. Midnight name plates and Major Gold score cells,
     skewed, the crown in the middle, the round on a gold band underneath, Tomorrow throughout.
     The gem is MM's separator everywhere, so it is drawn, never typed as a dot. */
  .mm-colors .piece .edge { background: #F0B40D; }
  .mm-colors .piece .face, .mm-colors .piece.bridge .face, .mm-colors .seg.center { background: #11151A; }
  .mm-colors .seg.badge { background: #F0B40D; color: #11151A; }
  body.mm-colors, .mm-colors .text { font-family: 'Tomorrow', Bahnschrift, 'Segoe UI', sans-serif; }
  .mm-colors .pips .pip { background: #11151A; border-color: #F0B40D; }
  .mm-colors .pips .pip.on { background: #F0B40D; }
  #mm { position: absolute; inset: 0; font-family: 'Tomorrow', Bahnschrift, 'Segoe UI', sans-serif; }
  #mm-board { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: stretch; filter: drop-shadow(0 4px 10px rgba(0,0,0,.45)); }
  #mm .seg { position: relative; display: flex; align-items: center; justify-content: center; transform: skewX(-8deg); overflow: hidden; }
  #mm .seg > span, #mm-round > span { display: inline-block; transform: skewX(8deg); white-space: nowrap; line-height: 1; }
  #mm .nm { background: #11151A; color: #fff; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
  #mm .pt { background: #F0B40D; color: #11151A; font-weight: 700; }
  #mm .cr { background: #11151A; margin: 0 2px; }
  #mm .cr svg { height: 64%; width: auto; transform: skewX(8deg); }
  #mm-round { position: absolute; left: 50%; transform: translateX(-50%) skewX(-8deg); background: #F0B40D; color: #11151A; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; padding: 6px 18px; white-space: nowrap; filter: drop-shadow(0 3px 8px rgba(0,0,0,.4)); }
  .mm-pips { position: absolute; display: none; gap: 12px; }
  .mm-pips .gem-pip { width: 15px; height: 15px; transform: rotate(45deg); background: #11151A; border: 2px solid #F0B40D; box-shadow: 0 2px 4px rgba(0,0,0,.5); }
  .mm-pips .gem-pip.on { background: #F0B40D; box-shadow: 0 0 10px rgba(240,180,13,.7); }
  svg.gem { display: inline-block; width: .42em; height: .42em; vertical-align: middle; transform: translateY(-.05em); margin: 0 .5em; }
  /* Corners: the rotating ticker bottom-left, the crown lockup bottom-right. */
  #mm-corners { position: absolute; inset: 0; font-family: 'Tomorrow', Bahnschrift, 'Segoe UI', sans-serif; color: #fff; text-transform: uppercase; }
  #mm-ticker { position: absolute; left: 44px; bottom: 30px; max-width: 1180px; font-weight: 700; font-size: 20px; letter-spacing: .1em; line-height: 1; white-space: nowrap; filter: drop-shadow(0 3px 8px rgba(0,0,0,.7)); transition: opacity .6s ease; }
  #mm-ticker::before { content: ''; position: absolute; left: -14px; top: -3px; bottom: -3px; width: 4px; background: #F0B40D; }
  #mm-ticker svg.gem { color: #F0B40D; }
  #mm-ticker .nb { white-space: nowrap; }
  #mm-lockup { position: absolute; right: 30px; bottom: 24px; display: flex; align-items: center; gap: 16px; filter: drop-shadow(0 3px 8px rgba(0,0,0,.6)); }
  #mm-lockup > svg { height: 56px; width: auto; }
  #mm-lockup b { display: block; font-weight: 700; font-size: 22px; letter-spacing: .1em; line-height: 1; }
  #mm-lockup small { display: block; margin-top: 6px; color: #F0B40D; font-weight: 700; font-size: 14px; letter-spacing: .14em; line-height: 1; }
  #mm-lockup small:empty { display: none; }
  #mm-lockup small svg.gem { margin: 0 .4em; }

  /* Texas Esports Collegiate: the Fall Split look. Near-black plates with a hairline edge and a Collegiate
     Blue rule along the top, blue score cells (stocks left in a crew battle), the TEC mark in the middle,
     and the event, round and format in light blue on a band underneath. Square-cornered, not skewed. */
  @font-face { font-family: 'Tomorrow'; src: url('/fonts/Tomorrow-SemiBold.ttf') format('truetype'); font-weight: 600; }
  @font-face { font-family: 'Tomorrow'; src: url('/fonts/Tomorrow-ExtraBold.ttf') format('truetype'); font-weight: 800; }
  .col-colors .piece .edge { background: #2B6FD4; }
  .col-colors .piece .face, .col-colors .piece.bridge .face, .col-colors .seg.center { background: #10141c; }
  .col-colors .seg.badge { background: #2B6FD4; color: #fff; }
  body.col-colors, .col-colors .text { font-family: 'Tomorrow', Bahnschrift, 'Segoe UI', sans-serif; }
  .col-colors .pips .pip { background: #10141c; border-color: #2B6FD4; }
  .col-colors .pips .pip.on { background: #2B6FD4; }
  #col { position: absolute; inset: 0; font-family: 'Tomorrow', Bahnschrift, 'Segoe UI', sans-serif; }
  #col-board { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: stretch; gap: 2px; padding: 2px; background: rgba(255,255,255,.18); border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.5); overflow: hidden; }
  #col-board::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: #2B6FD4; z-index: 1; }
  #col .seg { position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #col .seg > span { display: inline-block; white-space: nowrap; line-height: 1; }
  #col .nm { background: #0d1118; color: #fff; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
  #col .pt { background: #2B6FD4; color: #fff; font-weight: 800; }
  #col .mk { background: #0d1118; }
  #col .mk svg { height: 58%; width: auto; }
  /* Logo tiles at the outer ends (Settings, Team logos): a light tile, the logo or the team's initials. */
  #col .lg { background: #f3f4f6; color: #0E0E0E; font-weight: 800; }
  #col .lg img { width: 84%; height: 84%; object-fit: contain; display: block; }
  #col-band { position: absolute; left: 50%; transform: translateX(-50%); background: rgba(13,17,24,.94); border: 2px solid rgba(255,255,255,.16); border-radius: 4px; color: #5B95EA; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; padding: 6px 18px 6px calc(18px + .2em); white-space: nowrap; box-shadow: 0 3px 8px rgba(0,0,0,.4); }
  #col-band svg.gem { color: #2B6FD4; margin: 0 .6em; }
  .col-pips { position: absolute; display: none; gap: 10px; }
  .col-pips .pip { width: 26px; height: 10px; border-radius: 2px; background: #0d1118; border: 2px solid #2B6FD4; box-shadow: 0 2px 4px rgba(0,0,0,.5); }
  .col-pips .pip.on { background: #2B6FD4; box-shadow: 0 0 10px rgba(43,111,212,.8); }
  #col-lockup { position: absolute; right: 34px; bottom: 30px; filter: drop-shadow(0 3px 8px rgba(0,0,0,.7)); }
  #col-lockup svg { height: 48px; width: auto; display: block; }
  /* Texas Esports Conference, from TEC's Conference graphics: near-black plates, gold score cells and pips,
     the seven-stop Unity gradient along the top, gold band text and italic names like the lockup's wordmark. */
  .conf-colors .piece .edge { background: #F0B40D; }
  .conf-colors .piece .face, .conf-colors .piece.bridge .face, .conf-colors .seg.center { background: #0E0E0E; }
  .conf-colors .seg.badge { background: #F0B40D; color: #0E0E0E; }
  .conf-colors .pips .pip { background: #0E0E0E; border-color: #F0B40D; }
  .conf-colors .pips .pip.on { background: #F0B40D; }
  .conf-colors #col-board::before { background: linear-gradient(90deg, #FF3D2E 0%, #F18C32 16%, #F4D928 32%, #A8D62A 48%, #1FC97B 64%, #2BA8D4 84%, #2B6FD4 100%); }
  .conf-colors #col .nm, .conf-colors #col .mk { background: #0E0E0E; }
  .conf-colors #col .nm { font-style: italic; font-weight: 800; }
  .conf-colors #col .pt { background: #F0B40D; color: #0E0E0E; }
  .conf-colors #col .mk svg { height: 66%; }
  .conf-colors #col-band { color: #F0B40D; background: rgba(14,14,14,.94); font-weight: 700; }
  .conf-colors #col-band svg.gem { color: #9AA0A6; }
  .conf-colors .col-pips .pip { background: #0E0E0E; border-color: #F0B40D; }
  .conf-colors .col-pips .pip.on { background: #F0B40D; box-shadow: 0 0 10px rgba(240,180,13,.7); }
  .conf-colors #col-lockup svg { height: 54px; }
  .conf-colors #pcam { border-color: #F0B40D; box-shadow: 0 0 0 2px rgba(14,14,14,.9), 0 6px 18px rgba(0,0,0,.5); }
  /* The Metroplex Major ticker keeps its own gold when it runs in the Collegiate corner. */
  .col-colors #mm-lockup { display: none; }

  /* Team games (Overwatch, Marvel Rivals): a plate over each top corner (logo or tag tile, name, map pips,
     the team's hero ban, maps won) and a header flush with the top edge over the game's objective. The
     header is `full` (two lines) where the objective sits low and `slim` (one line) where it sits high;
     lib/teamgames.js has the measurements. Colours come from the theme through these variables. */
  #team { position: absolute; inset: 0; font-family: 'Tomorrow', Bahnschrift, 'Segoe UI', sans-serif; color: #fff;
    --tm-plate: rgba(20, 22, 27, .94); --tm-edge: rgba(255, 255, 255, .18); --tm-accent: #FF3D2E; --tm-accent-ink: #fff;
    --tm-lt: #ff8f85; --tm-pip: rgba(255, 255, 255, .18); --tm-rule: #FF3D2E; }
  .tt-colors #team { --tm-plate: rgba(28, 18, 21, .95); --tm-edge: rgba(242, 181, 58, .5); --tm-accent: #8E2B40; --tm-lt: #F2B53A; --tm-rule: #F2B53A; }
  .mm-colors #team { --tm-plate: rgba(17, 21, 26, .95); --tm-edge: rgba(240, 180, 13, .45); --tm-accent: #F0B40D; --tm-accent-ink: #11151A; --tm-lt: #F0B40D; --tm-rule: #F0B40D; }
  .col-colors #team { --tm-plate: rgba(13, 17, 24, .94); --tm-edge: rgba(255, 255, 255, .16); --tm-accent: #2B6FD4; --tm-lt: #5B95EA; --tm-rule: #2B6FD4; }
  .conf-colors #team { --tm-plate: rgba(14, 14, 14, .94); --tm-edge: rgba(255, 255, 255, .14); --tm-accent: #F0B40D; --tm-accent-ink: #0E0E0E; --tm-lt: #F0B40D; --tm-tile: #1a1a1a;
    --tm-rule: linear-gradient(90deg, #FF3D2E 0%, #F18C32 16%, #F4D928 32%, #A8D62A 48%, #1FC97B 64%, #2BA8D4 84%, #2B6FD4 100%); }
  .conf-colors #team .tm-name { font-style: italic; font-weight: 800; }
  .conf-colors #team .tm-mark span { font-style: italic; }
  .conf-colors #team .tm-ban b { color: #9AA0A6; }
  #team .tm-plate { position: absolute; top: 40px; width: 560px; height: 64px; display: flex; align-items: stretch; background: var(--tm-plate);
    border: 1.5px solid var(--tm-edge); border-radius: 4px; overflow: hidden; box-shadow: 0 6px 24px rgba(0, 0, 0, .35); box-sizing: border-box; }
  #team .tm-plate::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--tm-rule); }
  #team .tm-plate.left { left: 44px; }
  #team .tm-plate.right { right: 44px; flex-direction: row-reverse; }
  #team .tm-mark { flex: none; width: 62px; display: flex; align-items: center; justify-content: center; background: var(--tm-tile, #23262d); overflow: hidden; }
  #team .tm-mark img { width: 84%; height: 84%; object-fit: contain; }
  /* A team logo (Settings, Team logos) sits on a light tile, so dark marks read on every theme. */
  #team .tm-mark.logo { background: #f3f4f6; }
  #team .tm-mark span { font-weight: 800; font-size: 20px; letter-spacing: .02em; line-height: 1; }
  #team .tm-who { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 16px; }
  #team .right .tm-who { align-items: flex-end; }
  #team .tm-name { width: 100%; font-weight: 700; font-size: 28px; line-height: 1.05; text-transform: uppercase; white-space: nowrap; overflow: hidden; }
  #team .right .tm-name { text-align: right; }
  #team .tm-name span { display: inline-block; }
  #team .tm-pips { display: flex; gap: 6px; margin-top: 7px; }
  #team .tm-pips i { width: 30px; height: 5px; border-radius: 1px; background: var(--tm-pip); }
  #team .tm-pips i.on { background: var(--tm-lt); }
  #team .tm-ban { flex: none; width: 118px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(255, 255, 255, .035); border-left: 1.5px solid var(--tm-edge); }
  #team .right .tm-ban { border-left: 0; border-right: 1.5px solid var(--tm-edge); }
  #team .tm-ban[hidden] { display: none !important; }
  #team .tm-ban b { font-size: 11px; font-weight: 700; letter-spacing: .24em; padding-left: .24em; color: #ff8f85; }
  #team .tm-ban span { display: block; max-width: 106px; margin-top: 3px; font-size: 17px; font-weight: 700; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-align: center; }
  #team .tm-score { flex: none; width: 74px; display: flex; align-items: center; justify-content: center; background: var(--tm-accent); color: var(--tm-accent-ink); font-weight: 800; font-size: 42px; line-height: 1; }
  #team .tm-head { position: absolute; left: 50%; top: 0; width: 560px; transform: translate(-50%, var(--tm-nudge, 0px)); background: var(--tm-plate);
    border: 1.5px solid var(--tm-edge); border-top: 0; border-radius: 0 0 6px 6px; box-shadow: 0 6px 24px rgba(0, 0, 0, .35);
    display: flex; flex-direction: column; justify-content: center; align-items: center; box-sizing: border-box; padding: 0 18px; overflow: hidden; }
  #team .tm-head::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--tm-rule); }
  #team .tm-head.full { height: 54px; }
  #team .tm-head.slim { height: 34px; flex-direction: row; gap: 16px; }
  #team .tm-l1, #team .tm-l2 { max-width: 100%; white-space: nowrap; overflow: hidden; line-height: 1; text-transform: uppercase; }
  #team .tm-l1 span, #team .tm-l2 span { display: inline-block; }
  #team .tm-l1 { font-weight: 800; font-size: 22px; }
  #team .tm-l1 em { font-style: normal; color: var(--tm-lt); margin-left: 10px; }
  #team .tm-l2 { margin-top: 5px; font-weight: 600; font-size: 12px; letter-spacing: .2em; padding-left: .2em; color: var(--tm-lt); }
  #team .tm-head.slim .tm-l1 { font-size: 18px; }
  #team .tm-head.slim .tm-l2 { margin-top: 0; font-size: 11px; }
  #team .tm-plates { position: absolute; inset: 0; transform: translateY(var(--tm-plates, 0px)); }

  /* Player cam: a frame around the camera's window (the camera itself sits under the overlay in OBS).
     TEC red with a white edge; Tuesday Takedown gold in black; Metroplex Major gold. */
  #pcam { position: absolute; box-sizing: content-box; border: 4px solid #FF3D2E; box-shadow: 0 0 0 2px #fff, 0 6px 18px rgba(0,0,0,.5); pointer-events: none; }
  .tt-colors #pcam { border-color: #F2B53A; box-shadow: 0 0 0 3px #0a0a0a, 0 6px 18px rgba(0,0,0,.5); }
  .mm-colors #pcam { border-color: #F0B40D; box-shadow: 0 6px 18px rgba(0,0,0,.5); }
  .col-colors #pcam { border-color: #2B6FD4; box-shadow: 0 0 0 2px rgba(255,255,255,.18), 0 6px 18px rgba(0,0,0,.5); }
</style>
</head>
<body>
<div id="tec">
<!-- edges first, faces after, so the dark faces cover the white seams where pieces meet -->
<div id="edges"></div>
<div id="faces"></div>
<div id="segC" class="seg center"></div>
<div id="s1" class="seg badge"><span></span></div>
<div id="s2" class="seg badge"><span></span></div>
<div id="p1" class="text"><span></span></div>
<div id="p2" class="text"><span></span></div>
<div id="center" class="text"><span></span></div>
<div id="w1" class="pips"></div>
<div id="w2" class="pips"></div>
</div>
<div id="tt" hidden>
  <div id="tt-board">
    <div id="tt-frame1" class="blk"></div>
    <div id="tt-frame2" class="blk"></div>
    <div id="tt-band1" class="blk"></div>
    <div id="tt-band2" class="blk"></div>
    <div id="tt-plate1" class="plate"></div>
    <div id="tt-plate2" class="plate"></div>
  </div>
  <div id="tt-label" class="tt-text tt-label"><span></span></div>
  <div id="tt-n1" class="tt-text"><span></span></div>
  <div id="tt-n2" class="tt-text"><span></span></div>
  <div id="tt-s1" class="tt-text"><span></span></div>
  <div id="tt-s2" class="tt-text"><span></span></div>
  <div id="tt-sub1" class="tt-text tt-sub"><span></span></div>
  <div id="tt-sub2" class="tt-text tt-sub"><span></span></div>
  <div id="tt-w1" class="tt-pips"></div>
  <div id="tt-w2" class="tt-pips"></div>
  <img id="tt-logo" class="tt-logo" alt="" hidden>
  <div id="tt-emblem" class="tt-logo" hidden><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="#1a0d10" stroke="#F2B53A" stroke-width="6"/><circle cx="50" cy="50" r="36" fill="#6D2E3F"/><text x="50" y="62" text-anchor="middle" font-family="Urban Constructed, Silkscreen, monospace" font-weight="700" font-size="32" fill="#FCE319">TT</text></svg></div>
</div>
<div id="mm" hidden>
  <div id="mm-board">
    <div id="mm-n1" class="seg nm"><span></span></div>
    <div id="mm-s1" class="seg pt"><span></span></div>
