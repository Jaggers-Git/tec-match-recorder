<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TEC Match Recorder: replay badge</title>
<!-- The REPLAY badge over the clip in OBS's "TEC Replay" scene (Settings, Instant replay, Add replay scene
     to OBS). Transparent 1920x1080 Browser Source. It sits on the left edge below the scoreboard, since the
     clip already carries the stream overlay, and shows the slow-motion speed of the replay that is playing. -->
<style>
  @font-face { font-family: 'Tomorrow'; src: url('/fonts/Tomorrow-Bold.ttf') format('truetype'); font-weight: 700; }
  @font-face { font-family: 'Urban Constructed'; src: url('/fonts/UrbanConstructed-Regular.ttf') format('truetype'); font-weight: 100 900; }
  html, body { margin: 0; padding: 0; background: transparent; width: 1920px; height: 1080px; overflow: hidden; }
  body { position: relative; font-family: 'Urban Constructed', 'Tomorrow', Bahnschrift, 'Segoe UI', sans-serif; text-transform: uppercase; }
  [hidden] { display: none !important; }
  svg.gem { display: inline-block; width: .5em; height: .5em; vertical-align: middle; transform: translateY(-.06em); margin-right: .5em; }

  /* TEC: Ignite Red tag on the overlay's white-edged dark band */
  #badge { position: absolute; left: -24px; top: 180px; display: flex; flex-direction: column; align-items: flex-start; filter: drop-shadow(0 4px 10px rgba(0,0,0,.45)); }
  #badge.in { animation: slide .45s cubic-bezier(.2,.9,.25,1) both; }
  @keyframes slide { from { transform: translateX(-110%); } to { transform: translateX(0); } }
  .tag, .speed { transform: skewX(-12deg); }
  .tag > span, .speed > span { display: inline-block; transform: skewX(12deg); white-space: nowrap; line-height: 1; }
  .tag { background: #FF3D2E; color: #fff; padding: 16px 46px 14px 64px; font-size: 76px; font-weight: 700; letter-spacing: .14em; box-shadow: 0 0 0 4px #fff; }
  .speed { margin-top: 10px; margin-left: 30px; background: #2a2626; color: #fff; padding: 10px 26px 9px 44px; font-size: 28px; font-weight: 700; letter-spacing: .14em; box-shadow: 0 0 0 3px #fff; }
  .speed b { color: #FF3D2E; }

  /* Tuesday Takedown: maroon plate in a black frame, belt gold and yellow */
  :root[data-theme="tt"] .tag { background: linear-gradient(180deg, #7c3749 0%, #6D2E3F 42%, #5f2636 100%); color: #FCE319; box-shadow: 0 0 0 5px #0a0a0a; text-shadow: 0 4px 0 rgba(0,0,0,.55); }
  :root[data-theme="tt"] .speed { background: #0a0a0a; color: #ece4e6; box-shadow: 0 0 0 3px #F2B53A; }
  :root[data-theme="tt"] .speed b { color: #FCE319; }

  /* Metroplex Major: Major Gold on Midnight, Tomorrow, the gem as the mark */
  :root[data-theme="mm"] body { font-family: 'Tomorrow', Bahnschrift, 'Segoe UI', sans-serif; }
  :root[data-theme="mm"] .tag, :root[data-theme="mm"] .speed { transform: skewX(-8deg); }
  :root[data-theme="mm"] .tag > span, :root[data-theme="mm"] .speed > span { transform: skewX(8deg); }
  :root[data-theme="mm"] .tag { background: #F0B40D; color: #11151A; box-shadow: none; letter-spacing: .16em; }
  :root[data-theme="mm"] .speed { background: #11151A; color: #fff; box-shadow: 0 0 0 2px #F0B40D; }
  :root[data-theme="mm"] .speed b { color: #F0B40D; }
</style>
<script src="/theme.js"></script>
</head>
<body>
  <div id="badge">
    <div class="tag"><span>Replay</span></div>
    <div id="speed" class="speed" hidden><span id="speed-text"></span></div>
  </div>
<script src="/mm.js"></script>
<script>
(() => {
  'use strict';
  const $ = (sel) => document.querySelector(sel);
  let S = null;
  let lastPlay = '';
  function render() {
    if (!S) return;
    const theme = (S.branding && S.branding.theme) || 'tec';
    if (document.documentElement.dataset.theme !== theme) document.documentElement.dataset.theme = theme;
    const r = S.replay || {};
    const speed = Number((r.playing && r.playing.speed) || r.speed || 100);
    $('#speed').hidden = speed >= 100;
    const words = `Slow motion <b>${speed}%</b>`;
    $('#speed-text').innerHTML = theme === 'mm' && window.MM ? `${window.MM.gems('◆')}${words}` : words;
    // A new replay slides the badge in again.
    const play = r.playing ? `${r.playing.id}|${r.playing.at}` : '';
    if (play && play !== lastPlay) {
      const b = $('#badge');
      b.classList.remove('in');
      void b.offsetWidth;
      b.classList.add('in');
    }
    lastPlay = play;
  }
  let loadedVersion = '';
  const es = new EventSource('/api/events');
  es.addEventListener('state', (ev) => {
    S = JSON.parse(ev.data);
    if (S.version && loadedVersion && S.version !== loadedVersion) { location.reload(); return; }
    loadedVersion = loadedVersion || S.version || '';
    render();
  });
  $('#badge').classList.add('in');
})();
</script>
</body>
</html>
