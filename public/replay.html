<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TEC Match Recorder: replay badge</title>
<!-- The REPLAY badge over the clip in OBS's "TEC Replay" scene (Settings, Instant replay, Add replay scene
     to OBS). Transparent 1920x1080 Browser Source. It sits on the left edge below the scoreboard, since the
     clip already carries the stream overlay: the REPLAY tag and a bar under it that counts the replay down.
     The speed and the clip's name stay in the dashboard; the broadcast shows only that it is a replay. -->
<style>
  @font-face { font-family: 'Tomorrow'; src: url('/fonts/Tomorrow-Bold.ttf') format('truetype'); font-weight: 700; }
  @font-face { font-family: 'Urban Constructed'; src: url('/fonts/UrbanConstructed-Regular.ttf') format('truetype'); font-weight: 100 900; }
  html, body { margin: 0; padding: 0; background: transparent; width: 1920px; height: 1080px; overflow: hidden; }
  body { position: relative; font-family: 'Urban Constructed', 'Tomorrow', Bahnschrift, 'Segoe UI', sans-serif; text-transform: uppercase; }
  [hidden] { display: none !important; }

  /* TEC: Ignite Red tag with a white edge */
  #badge { position: absolute; left: -24px; top: 180px; display: flex; flex-direction: column; align-items: stretch; filter: drop-shadow(0 4px 10px rgba(0,0,0,.45)); }
  #badge.in { animation: slide .45s cubic-bezier(.2,.9,.25,1) both; }
  @keyframes slide { from { transform: translateX(-110%); } to { transform: translateX(0); } }
  .tag { transform: skewX(-12deg); background: #FF3D2E; color: #fff; padding: 16px 46px 14px 64px; font-size: 76px; font-weight: 700; letter-spacing: .14em; box-shadow: 0 0 0 4px #fff; }
  .tag > span { display: inline-block; transform: skewX(12deg); white-space: nowrap; line-height: 1; }

  /* Tuesday Takedown: maroon plate in a black frame, belt yellow */
  :root[data-theme="tt"] .tag { background: linear-gradient(180deg, #7c3749 0%, #6D2E3F 42%, #5f2636 100%); color: #FCE319; box-shadow: 0 0 0 5px #0a0a0a; text-shadow: 0 4px 0 rgba(0,0,0,.55); }

  /* Metroplex Major: Major Gold on Midnight, Tomorrow */
  :root[data-theme="mm"] body { font-family: 'Tomorrow', Bahnschrift, 'Segoe UI', sans-serif; }
  :root[data-theme="mm"] .tag { transform: skewX(-8deg); background: #F0B40D; color: #11151A; box-shadow: none; letter-spacing: .16em; }
  :root[data-theme="mm"] .tag > span { transform: skewX(8deg); }

  /* Countdown: a bar under the tag, as wide as it, that drains while the clip plays and is empty as the
     replay ends. Fed by /api/replay/progress (OBS's own position in the clip). */
  .bar { height: 12px; margin-top: 9px; background: #2a2626; box-shadow: 0 0 0 3px #fff; transform: skewX(-12deg); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: #FF3D2E; transform-origin: left center; transform: scaleX(1); }
  :root[data-theme="tt"] .bar { background: #0a0a0a; box-shadow: 0 0 0 3px #F2B53A; }
  :root[data-theme="tt"] .bar > i { background: #FCE319; }
  :root[data-theme="mm"] .bar { background: #11151A; box-shadow: 0 0 0 2px #F0B40D; transform: skewX(-8deg); height: 10px; }
  :root[data-theme="mm"] .bar > i { background: #F0B40D; }
</style>
<script src="/theme.js"></script>
</head>
<body>
  <div id="badge">
    <div class="tag"><span>Replay</span></div>
    <div id="bar" class="bar" hidden><i id="bar-fill"></i></div>
  </div>
<script>
(() => {
  'use strict';
  const $ = (sel) => document.querySelector(sel);
  let S = null;
  let lastPlay = '';
  function render() {
    if (!S) return;
    const theme = (S.branding && S.branding.theme) || 'tec';
    if (document.documentElement.dataset.theme !== theme) document.documentElement.dataset.theme = theme;
    const r = S.replay || {};
    // A new replay slides the badge in again.
    const play = r.playing ? `${r.playing.id}|${r.playing.at}` : '';
    if (play && play !== lastPlay) {
      const b = $('#badge');
      b.classList.remove('in');
      void b.offsetWidth;
      b.classList.add('in');
    }
    lastPlay = play;
    // Ask OBS where the clip is only while a replay plays.
    if (r.playing && !pollTimer) { poll(); pollTimer = setInterval(poll, 400); }
    if (!r.playing && pollTimer) { clearInterval(pollTimer); pollTimer = null; prog = null; }
  }

  // ---------- countdown bar ----------
  // Each poll gives OBS's position in the clip; between polls the bar moves on at the rate the cursor has
  // been moving (the replay speed until two polls have been seen), so it drains smoothly. A clip taken
  // live from Preview starts again from the top, and the bar fills up again with it.
  let pollTimer = null;
  let prog = null;
  async function poll() {
    let r;
    try { r = await (await fetch('/api/replay/progress', { cache: 'no-store' })).json(); } catch { return; }
    const now = performance.now();
    if (!r.playing) { prog = null; return; }
    if (!(r.duration > 0) || typeof r.cursor !== 'number') return;
    const key = `${r.id}|${r.at}`;
    let rate = (Number(r.speed) || 100) / 100;
    if (prog && prog.key === key && r.state === 'playing' && prog.state === 'playing' && r.cursor > prog.cursor) {
      const seen = (r.cursor - prog.cursor) / (now - prog.t);
      rate = seen > 0.02 && seen < 2 ? (prog.rate + seen) / 2 : prog.rate;
    }
    prog = { key, cursor: r.cursor, duration: r.duration, t: now, rate, state: r.state };
  }
  function frame() {
    requestAnimationFrame(frame);
    const bar = $('#bar');
    if (!prog) { bar.hidden = true; return; }
    const ahead = prog.state === 'playing' ? Math.min(1500, performance.now() - prog.t) * prog.rate : 0;
    const left = prog.state === 'ended' ? 0 : Math.max(0, Math.min(1, 1 - (prog.cursor + ahead) / prog.duration));
    bar.hidden = false;
    $('#bar-fill').style.transform = `scaleX(${left.toFixed(4)})`;
  }
  requestAnimationFrame(frame);
  let loadedVersion = '';
  const es = new EventSource('/api/events');
  es.addEventListener('state', (ev) => {
    S = JSON.parse(ev.data);
    if (S.version && loadedVersion && S.version !== loadedVersion) { location.reload(); return; }
    loadedVersion = loadedVersion || S.version || '';
    render();
  });
  $('#badge').classList.add('in');
})();
</script>
</body>
</html>
