<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TEC Match Recorder: Metroplex Major casters</title>
<!-- Casters scene, 1920x1080. The frame is drawn around two transparent windows: the gameplay capture
     and the camera sit underneath in OBS ("Add Metroplex Major scenes" places them; the boxes come from
     the server's CASTER_LAYOUT). Above the gameplay: the current set and score. Under the camera: one or
     two caster name cards typed in the dashboard, then the player cam's window when the player cam is on. -->
<style>
  @font-face { font-family: 'Tomorrow'; src: url('/fonts/Tomorrow-Bold.ttf') format('truetype'); font-weight: 700; }
  @font-face { font-family: 'Tomorrow'; src: url('/fonts/Tomorrow-ExtraBold.ttf') format('truetype'); font-weight: 800; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  body { position: relative; color: #fff; font-family: 'Tomorrow', Bahnschrift, 'Segoe UI', sans-serif; text-transform: uppercase; }
  [hidden] { display: none !important; }
  svg.gem { display: inline-block; width: .42em; height: .42em; vertical-align: middle; transform: translateY(-.05em); margin: 0 .5em; }
  #bg { position: absolute; inset: 0; }
  .frame { position: absolute; border: 4px solid #F0B40D; box-shadow: 0 0 24px rgba(0,0,0,.6); pointer-events: none; }
  /* motion (motion.css): the window frames glow now and then, offset so they never pulse together */
  .frame::after { content: ''; position: absolute; inset: -4px; box-shadow: 0 0 26px 2px rgba(240,180,13,.55); opacity: 0; animation: glow-pulse 6s ease-in-out infinite; pointer-events: none; }
  #frame-cam::after { animation-delay: 2s; }
  #frame-player::after { animation-delay: 4s; }
  :root[data-theme="col"] .frame::after { box-shadow: 0 0 26px 2px rgba(43,111,212,.65); }
  .bar { --sheen-every: 9s; --sheen-delay: 2.5s; --sheen-a: .55; }
  :root[data-theme="col"] .bar { --sheen-a: .12; }
  .tag { position: absolute; background: #F0B40D; color: #11151A; font-size: 18px; letter-spacing: .14em; padding: 6px 14px; transform: skewX(-8deg); }
  .tag > span { display: inline-block; transform: skewX(8deg); }
  /* scoreboard over the gameplay window, as on the stream overlay */
  #board { position: absolute; display: flex; height: 62px; transform: translateX(-50%); filter: drop-shadow(0 4px 10px rgba(0,0,0,.45)); }
  #board .seg { display: flex; align-items: center; justify-content: center; transform: skewX(-8deg); overflow: hidden; }
  #board .seg > span, #round > span { display: inline-block; transform: skewX(8deg); white-space: nowrap; line-height: 1; }
  #board .nm { width: 330px; background: #1d232c; font-size: 26px; letter-spacing: .05em; }
  #board .pt { width: 66px; background: #F0B40D; color: #11151A; font-size: 32px; }
  #board .cr { width: 92px; background: #1d232c; margin: 0 2px; }
  #board .cr svg { height: 64%; width: auto; transform: skewX(8deg); }
  #round { position: absolute; transform: translateX(-50%) skewX(-8deg); background: #F0B40D; color: #11151A; font-size: 17px; letter-spacing: .12em; padding: 6px 18px; white-space: nowrap; }
  #headline { position: absolute; transform: translateX(-50%); font-size: 46px; letter-spacing: .14em; white-space: nowrap; }
  /* caster name cards under the camera */
  .card { position: absolute; background: #1d232c; border-left: 8px solid #F0B40D; display: flex; flex-direction: column; justify-content: center; padding: 0 22px; box-sizing: border-box; box-shadow: 0 6px 16px rgba(0,0,0,.4); }
  .card b { display: block; align-self: flex-start; font-size: 34px; letter-spacing: .06em; line-height: 1; white-space: nowrap; }
  .card small { display: block; align-self: flex-start; margin-top: 8px; color: #F0B40D; font-size: 19px; letter-spacing: .1em; line-height: 1; text-transform: none; white-space: nowrap; }
  #lockup { position: absolute; display: flex; align-items: center; gap: 16px; }
  #lockup-art svg { height: 60px; width: auto; display: block; }
  #lockup b { display: block; font-size: 24px; letter-spacing: .1em; line-height: 1; }
  #lockup small { display: block; margin-top: 6px; color: #F0B40D; font-size: 15px; letter-spacing: .14em; line-height: 1; }
  /* Collegiate and Conference: the host school's or venue's logo beside the lockup, after a thin rule. */
  :root[data-theme="col"] #lockup-text, :root[data-theme="conf"] #lockup-text { display: none; }
  #lockup .host { display: flex; align-items: center; gap: 16px; }
  #lockup .host::before { content: ''; flex: none; width: 2px; height: 54px; background: rgba(255,255,255,.28); }
  #lockup .host img { display: block; height: 54px; width: auto; max-width: 230px; object-fit: contain; }
  #notice { position: absolute; left: 60px; width: 1280px; text-transform: none; color: #8e97a8; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.45; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #F0B40D; color: #11151A; display: flex; align-items: center; justify-content: space-between; gap: 40px; padding: 0 52px; font-size: 25px; letter-spacing: .07em; }
  #ticker { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; transition: opacity .6s ease; }
  #site { white-space: nowrap; flex: none; }

  /* Texas Esports Collegiate: Collegiate Blue on near-black, square corners, the TEC mark in the middle of
     the scoreboard and the Collegiate lockup in the corner. The bottom band stays the Metroplex Major's
     (midnight with a gold edge) and carries its ticker and notice while the Major promo is on. */
  @font-face { font-family: 'Tomorrow'; src: url('/fonts/Tomorrow-SemiBold.ttf') format('truetype'); font-weight: 600; }
  :root[data-theme="col"] .frame { border-color: #2B6FD4; border-radius: 2px; }
  :root[data-theme="col"] .tag { background: #2B6FD4; color: #fff; transform: none; border-radius: 4px; font-weight: 700; }
  :root[data-theme="col"] .tag > span { transform: none; }
  :root[data-theme="col"] #board { gap: 2px; padding: 2px; background: rgba(255,255,255,.18); border-radius: 6px; overflow: hidden; }
  :root[data-theme="col"] #board .seg, :root[data-theme="col"] #board .seg > span, :root[data-theme="col"] #round > span { transform: none; }
  :root[data-theme="col"] #board .nm, :root[data-theme="col"] #board .cr { background: #0d1118; margin: 0; }
  :root[data-theme="col"] #board .pt { background: #2B6FD4; color: #fff; }
  :root[data-theme="col"] #board .cr svg { transform: none; height: 58%; }
  :root[data-theme="col"] #round { transform: translateX(-50%); background: rgba(13,17,24,.94); color: #5B95EA; border: 2px solid rgba(255,255,255,.16); border-radius: 4px; font-weight: 600; letter-spacing: .2em; }
  :root[data-theme="col"] #round svg.gem { color: #2B6FD4; }
  :root[data-theme="col"] .card { background: #10141c; border: 2px solid rgba(255,255,255,.16); border-top: 4px solid #2B6FD4; border-radius: 4px; }
  :root[data-theme="col"] .card small { color: #5B95EA; }
  :root[data-theme="col"] #lockup-art svg { height: 54px; }
  :root[data-theme="col"] #lockup b { display: none; }
  :root[data-theme="col"] #lockup small { color: #5B95EA; font-weight: 600; font-size: 17px; letter-spacing: .2em; margin-top: 0; }
  :root[data-theme="col"] .bar { background: #11151A; color: #fff; border-top: 3px solid #F0B40D; box-sizing: border-box; font-weight: 700; }
  :root[data-theme="col"] .bar svg.gem { color: #F0B40D; }
  :root[data-theme="col"] #site { color: #F0B40D; }

  /* Texas Esports Conference, from TEC's Conference graphics: the windows framed in the Unity gradient, gold
     kickers and score cells, italic names like the lockup's wordmark, the dot grid behind, the Unity bar along
     the bottom. */
  :root[data-theme="conf"] .frame { border: 4px solid transparent; border-image: linear-gradient(90deg, #FF3D2E 0%, #F18C32 16%, #F4D928 32%, #A8D62A 48%, #1FC97B 64%, #2BA8D4 84%, #2B6FD4 100%) 1; border-radius: 0; }
  :root[data-theme="conf"] .frame::after { box-shadow: 0 0 28px 2px rgba(240,180,13,.38); }
  :root[data-theme="conf"] .tag { background: transparent; color: #F0B40D; transform: none; border-radius: 0; font-weight: 800; font-size: 20px; letter-spacing: .22em; padding: 6px 0; }
  :root[data-theme="conf"] .tag > span { transform: none; }
  :root[data-theme="conf"] #board { gap: 2px; padding: 2px; background: rgba(255,255,255,.16); border-radius: 6px; overflow: hidden; }
  :root[data-theme="conf"] #board .seg, :root[data-theme="conf"] #board .seg > span, :root[data-theme="conf"] #round > span { transform: none; }
  :root[data-theme="conf"] #board .nm, :root[data-theme="conf"] #board .cr { background: #0E0E0E; margin: 0; }
  :root[data-theme="conf"] #board .nm { font-style: italic; font-weight: 800; }
  :root[data-theme="conf"] #board .pt { background: #F0B40D; color: #0E0E0E; font-weight: 800; }
  :root[data-theme="conf"] #board .cr svg { transform: none; height: 64%; }
  :root[data-theme="conf"] #round { transform: translateX(-50%); background: rgba(14,14,14,.94); color: #F0B40D; border: 1px solid rgba(255,255,255,.14); border-radius: 4px; font-weight: 700; letter-spacing: .2em; }
  :root[data-theme="conf"] #round svg.gem { color: #9AA0A6; }
  :root[data-theme="conf"] .card { background: rgba(20,20,20,.94); border: 1px solid rgba(255,255,255,.16); border-radius: 4px; }
  :root[data-theme="conf"] .card b { font-style: italic; font-weight: 800; }
  :root[data-theme="conf"] .card small { color: #F0B40D; }
  :root[data-theme="conf"] #lockup-art svg { height: 54px; }
  :root[data-theme="conf"] #lockup b { display: none; }
  :root[data-theme="conf"] #lockup small { display: none; }
  :root[data-theme="conf"] .bar { background: #11151A; color: #fff; border-top: 3px solid #F0B40D; box-sizing: border-box; font-weight: 700; padding-bottom: 12px; }
  :root[data-theme="conf"] .bar::before { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 12px; background: linear-gradient(90deg, #FF3D2E 0%, #F18C32 16%, #F4D928 32%, #A8D62A 48%, #1FC97B 64%, #2BA8D4 84%, #2B6FD4 100%); }
  :root[data-theme="conf"] .bar svg.gem { color: #F0B40D; }
  :root[data-theme="conf"] #site { color: #F0B40D; }
  :root[data-theme="conf"] .bar { --sheen-a: .12; }
  /* The band with the promo off: the event in the theme's own colours. */
  :root[data-theme="col"] .bar.event { border-top-color: #2B6FD4; background: #0d1118; }
  :root[data-theme="col"] .bar.event svg.gem { color: #2B6FD4; }
  :root[data-theme="conf"] .bar.event { background: #0E0E0E; border-top: 1px solid rgba(255,255,255,.10); }
  :root[data-theme="conf"] .bar.event svg.gem { color: #F0B40D; }
  .bar.event #site { color: #fff; }
</style>
<link rel="stylesheet" href="/motion.css">
</head>
<body>
  <!-- Midnight background with the two windows cut out of it -->
  <svg id="bg" viewBox="0 0 1920 1080" aria-hidden="true">
    <defs>
      <radialGradient id="glow" cx="0.85" cy="0" r="0.8"><stop offset="0" stop-color="#F0B40D" stop-opacity=".10"/><stop offset="1" stop-color="#F0B40D" stop-opacity="0"/></radialGradient><radialGradient id="glow-col" cx="0.85" cy="0" r="0.8"><stop offset="0" stop-color="#2B6FD4" stop-opacity=".22"/><stop offset="1" stop-color="#2B6FD4" stop-opacity="0"/></radialGradient><radialGradient id="glow-conf" cx="0.85" cy="0" r="0.8"><stop offset="0" stop-color="#1FC97B" stop-opacity=".14"/><stop offset="1" stop-color="#ff4635" stop-opacity="0"/></radialGradient>
      <pattern id="dots-conf" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1.2" fill="#fff" fill-opacity=".06"/></pattern>
      <mask id="holes"><rect width="1920" height="1080" fill="#fff"/><rect id="hole-game" fill="#000"/><rect id="hole-cam" fill="#000"/><rect id="hole-player" fill="#000" width="0" height="0"/></mask>
    </defs>
    <g mask="url(#holes)">
      <rect id="bg-fill" width="1920" height="1080" fill="#11151A"/>
      <rect id="bg-glow" width="1920" height="1080" fill="url(#glow)"/>
      <rect id="bg-dots" width="1920" height="1080" fill="none"/>
    </g>
  </svg>
  <div id="frame-game" class="frame"></div>
  <div id="frame-cam" class="frame"></div>
  <div id="frame-player" class="frame" hidden></div>
  <div id="board" hidden>
    <div id="n1" class="seg nm"><span></span></div>
    <div id="s1" class="seg pt"><span></span></div>
    <div id="crest" class="seg cr"><svg viewBox="-6 -38 190 128" aria-hidden="true"><g fill="#F0B40D"><polygon points="0,9 9,0 22,0 50,28 78,0 89,-13 100,0 128,28 156,0 169,0 178,9 178,69 169,78 156,78 156,31 128,59 100,31 100,78 78,78 78,31 50,59 22,31 22,78 9,78 0,69"/><polygon points="15.5,-15 21.5,-9 15.5,-3 9.5,-9"/><polygon points="89,-32.5 96.5,-25 89,-17.5 81.5,-25"/><polygon points="162.5,-15 168.5,-9 162.5,-3 156.5,-9"/></g></svg></div>
    <div id="s2" class="seg pt"><span></span></div>
    <div id="n2" class="seg nm"><span></span></div>
  </div>
  <div id="round" hidden><span></span></div>
  <div id="headline" hidden>Metroplex Major</div>
  <div id="cam-tag" class="tag"><span>On the mic</span></div>
  <div id="player-tag" class="tag" hidden><span>Players</span></div>
  <div id="card1" class="card" hidden><b></b><small></small></div>
  <div id="card2" class="card" hidden><b></b><small></small></div>
  <div id="lockup"><div id="lockup-art">
    <svg viewBox="-6 -38 190 128" aria-hidden="true"><g fill="#F0B40D"><polygon points="0,9 9,0 22,0 50,28 78,0 89,-13 100,0 128,28 156,0 169,0 178,9 178,69 169,78 156,78 156,31 128,59 100,31 100,78 78,78 78,31 50,59 22,31 22,78 9,78 0,69"/><polygon points="15.5,-15 21.5,-9 15.5,-3 9.5,-9"/><polygon points="89,-32.5 96.5,-25 89,-17.5 81.5,-25"/><polygon points="162.5,-15 168.5,-9 162.5,-3 156.5,-9"/></g></svg>
    </div><div id="lockup-text"><b id="lockup-name">Metroplex Major</b><small id="lockup-sub"></small></div><div id="lockup-host" class="host" hidden><img alt=""></div>
  </div>
  <div id="notice"></div>
  <div class="bar sheen"><span id="ticker"></span><span id="site"></span></div>
<script src="/mm.js"></script>
<script src="/col.js"></script>
<script src="/conf.js"></script>
<script>
(() => {
  'use strict';
  const $ = (sel) => document.querySelector(sel);
  const px = (n) => `${Math.round(n)}px`;
  let S = null;
  let ticker = null;
  let promoOn = true;
  let eventCfg = null;
  // The band's lines: the Major's while its promo is on, else the event, the typed message and the site.
  function tickerLines() {
    if (!S) return [];
    if (promoOn || !eventCfg) return window.MM.lines(S).filter((l) => !/^metroplexmajor\.com/i.test(l));
    const lines = [`${eventCfg.org} ◆ ${eventCfg.title || eventCfg.fallback}`];
    if (eventCfg.game) lines.push(eventCfg.game);
    const msg = (S.screens && S.screens.message) || '';
    if (msg) lines.push(msg);
    lines.push('texasesports.org');
    return lines;
  }
  const place = (el, b) => { el.style.left = px(b.x); el.style.top = px(b.y); el.style.width = px(b.w); el.style.height = px(b.h); };
  const setRect = (el, b) => { for (const k of ['x', 'y']) el.setAttribute(k, b[k]); el.setAttribute('width', b.w); el.setAttribute('height', b.h); };
  // Shrink until it fits, so long tags stay whole.
  function fit(el, text, max, room) {
    el.textContent = text || '';
    let size = max;
    el.style.fontSize = px(size);
    while (size > 12 && el.scrollWidth > room) { size -= 1; el.style.fontSize = px(size); }
  }
  // The Metroplex Major artwork this page starts with, put back if the station leaves the Collegiate theme.
  const MM_ART = { crest: $('#crest').innerHTML, lockup: $('#lockup-art').innerHTML };
  let artTheme = '';
  function render() {
    if (!S) return;
    const L = S.screenLayout || { game: { x: 60, y: 168, w: 1280, h: 720 }, cam: { x: 1380, y: 168, w: 480, h: 270 } };
    const mm = (S.branding && S.branding.mm) || {};
    // Collegiate and Conference share the Collegiate frame; the Conference brings its own art and colours.
    const confTheme = !!(S.branding && S.branding.theme === 'conf');
    const col = S.branding && (S.branding.theme === 'col' || confTheme) ? (confTheme ? S.branding.conf : S.branding.col) || {} : null;
    const theme = confTheme ? 'conf' : col ? 'col' : 'mm';
    if (theme !== artTheme) {
      artTheme = theme;
      document.documentElement.dataset.theme = theme;
      const ART = confTheme ? window.CONF : window.COL;
      $('#crest').innerHTML = col ? ART.mark() : MM_ART.crest;
      $('#lockup-art').innerHTML = col ? ART.lockup() : MM_ART.lockup;
      window.MM.shine($('#lockup-art svg'), 'polygon, path', { delay: 1, every: 8 });
      $('#bg-fill').setAttribute('fill', confTheme ? '#0E0E0E' : col ? '#0A0A0A' : '#11151A');
      $('#bg-dots').setAttribute('fill', confTheme ? 'url(#dots-conf)' : 'none');
      $('#bg-glow').setAttribute('fill', confTheme ? 'url(#glow-conf)' : col ? 'url(#glow-col)' : 'url(#glow)');
    }
    // Settings, Stream screens: Motion off keeps the frame still and the ticker fading.
    const motion = !(S.branding && S.branding.motion === false);
    document.documentElement.classList.toggle('still', !motion);
    $('#headline').textContent = col ? col.title || (confTheme ? 'Fall Finals' : 'Fall Split') : 'Metroplex Major';
    // The bottom band always crawls. With the Major promo on it carries the Major's lines in its gold; with it
    // off (Collegiate or Conference) it carries the event in the theme's colours, and the notice goes.
    const promo = !col || col.promo !== false;
    promoOn = promo;
    eventCfg = col ? { ...col, org: confTheme ? 'Texas Esports Conference' : 'Texas Esports Collegiate', fallback: confTheme ? 'Fall Finals' : 'Fall Split' } : null;
    const bandEl = document.querySelector('.bar');
    bandEl.hidden = false;
    bandEl.classList.toggle('event', !promo);
    $('#notice').hidden = !promo;
    const c = S.current || {};
    setRect($('#hole-game'), L.game);
    setRect($('#hole-cam'), L.cam);
    place($('#frame-game'), { x: L.game.x - 4, y: L.game.y - 4, w: L.game.w, h: L.game.h });
    place($('#frame-cam'), { x: L.cam.x - 4, y: L.cam.y - 4, w: L.cam.w, h: L.cam.h });
    // Set and score above the gameplay window; the Major's name when no set is picked.
    const cx = L.game.x + L.game.w / 2;
    const live = !!(c.p1 && c.p2);
    $('#board').hidden = !live;
    $('#headline').hidden = live;
    $('#board').style.left = px(cx);
    $('#board').style.top = px(L.game.y - 62 - 56);
    $('#headline').style.left = px(cx);
    $('#headline').style.top = px(L.game.y - 100);
    if (live) {
      for (const side of [1, 2]) {
        fit($(`#n${side} span`), c[`p${side}`], 26, 300);
        $(`#s${side} span`).textContent = String(c[`score${side}`] || 0);
      }
      const bestOf = Number(c.bestOf) || 1;
      const crews = !!(S.branding && S.branding.crews && S.branding.crews.enabled);
      const parts = [c.round || '', crews ? 'Crew battle' : '', bestOf > 1 ? `Best of ${bestOf}` : ''].filter(Boolean);
      $('#round').hidden = !parts.length;
      $('#round').style.left = px(cx);
      $('#round').style.top = px(L.game.y - 46);
      $('#round span').innerHTML = window.MM.gems(parts.join(' ◆ '));
    } else $('#round').hidden = true;
    // "On the mic" above the camera, then the name cards under it.
    const tag = $('#cam-tag');
    tag.style.left = px(L.cam.x - 4);
    tag.style.top = px(L.cam.y - 46);
    const casters = ((S.screens && S.screens.casters) || []).filter((k) => k && k.name);
    let y = L.cam.y + L.cam.h + 16;
    for (const i of [0, 1]) {
      const card = $(`#card${i + 1}`);
      const k = casters[i];
      card.hidden = !k;
      if (!k) continue;
      place(card, { x: L.cam.x - 4, y, w: L.cam.w, h: k.handle ? 96 : 76 });
      fit(card.querySelector('b'), k.name, 34, L.cam.w - 60);
      card.querySelector('small').textContent = k.handle || '';
      card.querySelector('small').hidden = !k.handle;
      y += (k.handle ? 96 : 76) + 14;
    }
    // Player cam (Settings, Player cam): a third window under the caster cards, with its own tag. It takes
    // the crown lockup's place; the gold band below still carries the Major's name.
    const pl = L.player;
    const pcOn = !!(pl && S.playerCam && S.playerCam.enabled);
    $('#frame-player').hidden = !pcOn;
    $('#player-tag').hidden = !pcOn;
    $('#lockup').hidden = pcOn;
    setRect($('#hole-player'), pcOn ? pl : { x: 0, y: 0, w: 0, h: 0 });
    if (pcOn) {
      place($('#frame-player'), { x: pl.x - 4, y: pl.y - 4, w: pl.w, h: pl.h });
      $('#player-tag').style.left = px(pl.x - 4);
      $('#player-tag').style.top = px(pl.y - 44);
    }
    // Crown lockup at the foot of the right column, level with the bottom of the gameplay window.
    const lock = $('#lockup');
    lock.style.left = px(L.cam.x);
    lock.style.top = px(L.game.y + L.game.h - 64);
    $('#lockup-sub').innerHTML = col ? '' : window.MM.gems(mm.mode === 'event' ? 'UNT Dallas' : 'Feb 5-7, 2027 ◆ UNT Dallas');
    $('#lockup-sub').hidden = !!col;
    // Settings, Look and games: the host's logo beside the Collegiate or Conference lockup.
    const host = col ? ((S.branding && S.branding.logos) || {})[theme] || '' : '';
    $('#lockup-host').hidden = !host;
    const hostImg = $('#lockup-host img');
    if (host && hostImg.getAttribute('src') !== host) hostImg.src = host;
    $('#notice').style.top = px(L.game.y + L.game.h + 22);
    $('#notice').innerHTML = window.MM.gems(`${col ? 'Metroplex Major: ' : ''}Nintendo is not a sponsor of or affiliated with this tournament. Terms for participating in and viewing Licensed Tournaments using Nintendo Games: https://en-americas-support.nintendo.com/app/answers/detail/a_id/63454 ◆ Tournament license ${mm.license || ''}`);
    $('#site').innerHTML = promo ? window.MM.gems(`${mm.site || 'metroplexmajor.com'} ◆ #MetroplexMajor`) : 'texasesports.org';
    if (!ticker) ticker = window.MM.bar($('#ticker'), tickerLines);
    ticker.set(motion);
  }
  let loadedVersion = '';
  const es = new EventSource('/api/events');
  es.addEventListener('state', (ev) => {
    S = JSON.parse(ev.data);
    if (S.version && loadedVersion && S.version !== loadedVersion) { location.reload(); return; }
    loadedVersion = loadedVersion || S.version || '';
    render();
  });
  // Re-fit the names once Tomorrow has loaded (it loads only when first used, after fonts.ready).
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
  if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', render);
})();
</script>
</body>
</html>
